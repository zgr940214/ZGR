MACHINE = "raspberrypi4-64"
DISTRO = "poky"
PACKAGE_CLASSES = "package_ipk"
CONF_VERSION = "2"

PREFERRED_PROVIDER_virtual/kernel = "linux-raspberrypi"
PREFERRED_VERSION_linux-raspberrypi = "6.12.93%"

# gdbserver does not use the full GDB Python integration. Avoid pulling the
# target Python ptest/compiler dependency closure into this image build.
PACKAGECONFIG:remove:pn-gdb = "python"
# These target test subpackages pull in GCC/G++ through recipe-wide runtime
# dependencies even when ptest-pkgs is absent from the image.
PTEST_ENABLED:pn-python3 = "0"
PTEST_ENABLED:pn-elfutils = "0"
# The matching debug bundle already contains every full-symbol module.
MODULE_TARBALL_DEPLOY = "0"
# Publish final artifacts without also storing a second compressed cache copy.
SSTATE_SKIP_CREATION:pn-linux-raspberrypi:task-deploy = "1"
SSTATE_SKIP_CREATION:pn-rpi4-debug-image:task-image-complete = "1"

DL_DIR = "${TOPDIR}/../downloads"
SSTATE_DIR = "${TOPDIR}/../sstate-cache"
BB_NUMBER_THREADS = "2"
PARALLEL_MAKE = "-j 4"
INHERIT += "rm_work buildhistory own-mirrors"
BUILDHISTORY_COMMIT = "0"
RM_WORK_EXCLUDE += "linux-raspberrypi"
BB_DISKMON_DIRS = "STOPTASKS,${TMPDIR},2G,100K STOPTASKS,${DL_DIR},2G,100K HALT,${TMPDIR},1G,50K"

SOURCE_MIRROR_URL = "https://downloads.yoctoproject.org/mirror/sources/"
# Use BitBake's local-file mirror path so missing remote mirrors cannot clean
# the independently verified kernel archive. Other kernel Git sources may
# fall back to their declared HTTPS upstream when absent locally.
SOURCE_MIRROR_URL:pn-linux-raspberrypi = "file://${TOPDIR}/../kernel-source-cache/"
BB_GIT_SHALLOW = "1"
BB_GENERATE_SHALLOW_TARBALLS = "1"
SSTATE_MIRRORS = "file://.* https://sstate.yoctoproject.org/all/PATH;downloadfilename=PATH"
# The public sstate mirror has no shared hash service reachable in this cloud.
BB_HASHSERVE = ""
BB_SIGNATURE_HANDLER = "OEBasicHash"
# Test an HTTPS destination already available through the cloud proxy.
CONNECTIVITY_CHECK_URIS = "https://github.com/"
UNINATIVE_URL = "https://downloads.yoctoproject.org/releases/uninative/${UNINATIVE_VERSION}/"

ENABLE_UART = "1"
IMAGE_FSTYPES = "wic.bz2 wic.bmap tar.bz2"

# Do not enable debug-tweaks or passwordless remote root access.
# This development image needs user-provisioned login credentials before SSH use.
